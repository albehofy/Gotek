<aside class="sidebar" id="sidebar" [class.open]="sidebarOpen">
  <div class="sb-header">
    <img src="assets/gotek-icon.png" alt="Gotek" style="height: 32px; width: 32px; border-radius: 8px; box-shadow: 0 4px 12px rgba(232,98,10,0.3);" />
    <span style="font-weight: 700; font-size: 1.2rem;">Gotek Admin</span>
  </div>
  <nav class="sb-nav">
    <a routerLink="overview" routerLinkActive="active" class="nav-item">
      <i class="fi fi-rr-apps"></i>
      <span>Dashboard</span>
    </a>

    <a *ngIf="currentUser?.role === 'admin' || currentUser?.role === 'manager' || currentUser?.role === 'task_generator' || currentUser?.role === 'client'" routerLink="deals" routerLinkActive="active" class="nav-item">
      <i class="fi fi-rr-briefcase"></i>
      <span>Client Deals</span>
    </a>

    <a routerLink="task-board" routerLinkActive="active" class="nav-item">
      <i class="fi fi-rr-settings-sliders"></i>
      <span>Task Board</span>
    </a>

    <a *ngIf="currentUser?.role === 'admin' || currentUser?.role === 'manager' || currentUser?.role === 'department_manager'" routerLink="team-mgmt" routerLinkActive="active" class="nav-item">
      <i class="fi fi-rr-users"></i>
      <span>Team & Depts</span>
    </a>
    
    <a *ngIf="currentUser?.role === 'admin' || currentUser?.role === 'manager'" routerLink="contact-hub" routerLinkActive="active" class="nav-item">
      <i class="fi fi-rr-edit"></i>
      <span>Contact Hub</span>
    </a>

    <!-- Collapsible Website Content Menu -->
    <div class="nav-dropdown" [class.open]="websiteMenuOpen" *ngIf="currentUser?.role === 'admin' || currentUser?.role === 'manager'">
      <div class="nav-item dropdown-toggle-btn" (click)="toggleWebsiteMenu()" style="cursor: pointer;">
        <i class="fi fi-rr-globe"></i>
        <span>Website Content</span>
        <i class="fi fi-rr-angle-small-down arrow-icon" style="margin-left: auto; transition: transform 0.3s;" [style.transform]="websiteMenuOpen ? 'rotate(180deg)' : 'none'"></i>
      </div>
      <div class="dropdown-menu-list" [style.max-height]="websiteMenuOpen ? '400px' : '0'" style="overflow: hidden; transition: max-height 0.3s ease-in-out; padding-left: 16px;">
        <a routerLink="projects" routerLinkActive="active" class="nav-sub-item nav-item">
          <i class="fi fi-rr-briefcase"></i>
          <span>Projects</span>
        </a>
        <a routerLink="categories" routerLinkActive="active" class="nav-sub-item nav-item">
          <i class="fi fi-rr-list"></i>
          <span>Categories</span>
        </a>
        <a routerLink="services" routerLinkActive="active" class="nav-sub-item nav-item">
          <i class="fi fi-rr-settings-sliders"></i>
          <span>Services</span>
        </a>
        <a routerLink="testimonials" routerLinkActive="active" class="nav-sub-item nav-item">
          <i class="fi fi-rr-comment-user"></i>
          <span>Testimonials</span>
        </a>
        <a routerLink="faqs" routerLinkActive="active" class="nav-sub-item nav-item">
          <i class="fi fi-rr-interrogation"></i>
          <span>FAQs</span>
        </a>
        <a routerLink="blogs" routerLinkActive="active" class="nav-sub-item nav-item">
          <i class="fi fi-rr-document-signed"></i>
          <span>Blog Articles</span>
        </a>
      </div>
    </div>

    <div style="margin-top: 40px; padding: 0 12px; font-size: 0.7rem; color: rgba(255,255,255,0.4); text-transform: uppercase;">System</div>
    <a routerLink="settings" routerLinkActive="active" class="nav-item">
      <i class="fi fi-rr-settings"></i>
      <span>Settings</span>
    </a>
    <a href="javascript:void(0)" class="nav-item danger" (click)="logout()">
      <i class="fi fi-rr-exit"></i>
      <span>Logout</span>
    </a>
  </nav>
</aside>

<main class="main" id="main">
  <header class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
      <button class="menu-toggle" (click)="toggleSidebar()"><i class="fi fi-rr-menu-burger"></i></button>
      <div class="title-wrap">
        <h1>Agency Hub</h1>
        <p>Welcome back, <span id="adminName">{{ adminName }}</span>. Here's what's happening across all clients.</p>
      </div>
    </div>
  </header>

  <router-outlet></router-outlet>
</main>
