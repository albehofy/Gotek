<div class="login-wrapper" style="width: 100%; height: 100%; margin: 0; padding: 0;">
  <div class="login-container">
    <!-- Logo Section -->
    <div class="login-header">
      <div class="login-logo">
        <div class="logo-circle"><span>G</span></div>
        <h1>Gotek<em>.</em></h1>
      </div>
      <p class="login-subtitle">Digital Solutions Dashboard</p>
    </div>

    <!-- Form Section -->
    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          class="form-input"
          placeholder="Enter your email"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-input"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-footer">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          <span>Remember me</span>
        </label>
        <button type="button" class="forgot-link" (click)="onForgotPassword()">
          Forgot Password?
        </button>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage()" class="error-message">
        {{ errorMessage() }}
      </div>

      <!-- Login Button -->
      <button type="submit" class="login-btn" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Sign In</span>
        <span *ngIf="isLoading()">Signing in...</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>Don't have an account? <a href="#">Request access</a></p>
    </div>
  </div>

  <!-- Background illustration -->
  <div class="login-bg">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
  </div>
</div>
